name: Reproducibility checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: sha256sum -c data/MANIFEST.sha256
      - run: python scripts/reproduce_plots.py --output-dir outputs/ci-redraw
      - run: python scripts/audit_release.py
